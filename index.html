<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuntia | Inicio de sesión</title>
    <link rel="stylesheet" href="styles/login.css">
    <script src="src/login.js"></script>
</head>
<body>
    <main class="login-container">
        <h1>Iniciar sesión</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="user-code">Código de usuario</label>
                <input type="text" id="user-code" name="user-code" required placeholder="Ej: EST-001 o PRO-012">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Tu contraseña">
            </div>
            <p class="error-hidden" id="error-message">Usuario o contraseña no validas.</p>
            <button type="button" id="login-button" class="btn-login">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
